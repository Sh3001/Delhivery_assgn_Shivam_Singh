amr1_ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: false
    publish_tf: true
    publish_acceleration: false

    map_frame: amr1/map
    odom_frame: amr1/odom
    base_link_frame: amr1/base_footprint
    world_frame: amr1/odom

    odom0: /amr1/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10


    imu0: /amr1/imu_validated
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    use_control: false

[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
max-line-length = 99
show-source = true
statistics = true

# generate_warehouse_world.py builds the world SDF from triple-quoted XML
# templates. Those long lines are DATA, not code: wrapping them would change
# the generated world's whitespace, and `# noqa` cannot be used because the
# comment would land inside the string and be emitted into the SDF. The code
# in that file is held to the same limit as everywhere else.
per-file-ignores =
    scripts/generate_warehouse_world.py:E501

locations:
  heavy_storage:
    # Verified against a FULLY EXPLORED costmap: cost 0 with 1.8 m of clear
    # space in every direction. A goal needs robot_radius (0.35) + inflation
    # (0.55) = 0.95 m before the robot can finish, and clearance must be
    # measured once the area is actually mapped.
    #
    # The previous point (-19.0, -6.0) measured 1.3 m on a partly-built map
    # and only 0.2 m once explored. AMR-1 drove to within 0.45 m of it, its
    # own cell went lethal, DWB stopped emitting commands and the goal
    # aborted every time - the robot was fine, the goal was not reachable.
    x: -20.5
    y: 1.5
    yaw: 0.0
    description: "West block, ground floor - no ramp involved on any route"

  rack_aisle:
    x: -15.5
    y: -4.0
    yaw: 1.5708
    description: >-
      The tight one - squarely between two pallet racks, for amr2 only.
      The y = -4 row carries racks at x = -17 and x = -14; each pallet_rack
      is 1.4 m long in x, so their faces sit at x = -16.3 and x = -14.7 and
      the slot between them is just 1.60 m wide. x = -15.5 is its centre,
      0.80 m off each rack. This is the far pair - the same 1.60 m slot
      exists at x = -24.5 between the x = -26 and x = -23 racks, but that one
      sits 2.8 m from amr2's spawn and barely counts as a transit.
      .
      Sized for the light_scout and nothing bigger. 0.80 m clears the 0.55 m
      inflation so the goal cell costs 0; it clears amr2's 0.32 m
      circumscribed radius so it can still turn on the spot; and a rack
      0.80 m to the side only enters the +/-40 deg safety cone at 1.24 m,
      past the 0.50 m that would halt it. The planner threads a 0.50 m
      zero-cost corridor (1.60 - 2 x 0.55).
      .
      yaw 90 deg faces the robot ALONG the slot. Facing across it would put
      a rack 0.80 m dead ahead, and pointing a forward safety cone straight
      into a rack is how amr1 wedged itself in the 3.1 m aisle at y = -6.
      Do not send amr1 here: its 0.65 m cone and 0.35 m radius do not fit.

  ramp_side:
    x: -5.0
    y: 4.5
    yaw: 0.0
    description: >-
      Ground floor alongside ramp_up, level with the middle of the ramp
      (ramp_up spans x -10..0, y -2..2, centred at x = -5). North of the
      kerb, not on the incline: ramp_up_kerb_n sits at y = 1.94 and the
      costmap blocks it out to y = 3.2, so y = 4.5 leaves 1.3 m against the
      0.95 m a goal needs (robot_radius 0.35 + inflation 0.55). Nothing
      static is near it - the closest fixed structure is mezz_rail_wn at
      x = 0.06, five metres east.

  packing_bay_4:
    x: 1.0
    y: 0.0
    yaw: 0.0

  packing_bay_4_farside:
    x: 22.0
    y: 0.0
    yaw: 0.0
    description: >-
      East block, ground floor. Reachable EITHER over the bridge (~36 m, 20 m
      of it on ramps) OR around it along the flat bypass aisles (~52 m). This
      is the location that makes the ramp cost function observable: a correct
      cost takes the longer flat route.
  mezzanine_dock:
    x: 4.0
    y: 0.0
    yaw: 0.0
    description: >-
      On the elevated deck (z=1.0), reachable ONLY by ramp - the control case
      proving the cost function still climbs when it has to.

  platform_east:
    x: 5.0
    y: 0.5
    yaw: 0.0
    description: >-
      On the mezzanine deck (z=1.0), east end. Reachable only by climbing
      ramp_up, so a goal here forces ramp traversal. Verified against the live
      inflated costmap: cost 16 with 2.5 m clearance. Sits in the deck's
      central band (|y| < 1), clear of the ped_4 and robot_4 patrol lanes -
      a robot parked inside a patrol lane gets driven into by a patroller
      that has no collision avoidance of its own.

  platform_west:
    x: 2.0
    y: -0.8
    yaw: 0.0
    description: >-
      On the mezzanine deck (z=1.0), just past the top of ramp_up. Same
      reasoning as platform_east: 2.1 m clearance, inside the central band.
      3.3 m from platform_east, so both robots can hold station on the deck
      without their footprints interacting.
